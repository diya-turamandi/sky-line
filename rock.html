<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1>Rock-paper-scissors</h1>
    <div class="choices">
        <div class="choice" >
            <img src="./img/rock.png" id="rock">
        </div>
        <div class="choice" >
            <img src="./img/paper.png" id="paper">
        </div>
        <div class="choice" >
            <img src="./img/scissors.jpg"id="scissors">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user" style="border-width: 2px; border-style: solid; border-color: black;">0</p>
            <p>user</p>
        </div>
        <div class="score">
            <p id="comp" style="border-width: 2px; border-style: solid; border-color: black;">0</p>

            <p>com</p>
        </div>
    </div>
    <div class="messcont">
        <p id="mess">play ur move</p>
    </div>
    <div class="game">
        <p id="disp">best of luck</p>
    </div>
    <script src="aap2.js"></script>
</body>
</html>
